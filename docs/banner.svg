<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Cinema Aureo">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a0a12"/>
      <stop offset="45%" stop-color="#0e0d12"/>
      <stop offset="100%" stop-color="#07060a"/>
    </linearGradient>
    <linearGradient id="oro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2dc9b"/>
      <stop offset="55%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8f7420"/>
    </linearGradient>
    <radialGradient id="alone" cx="18%" cy="12%" r="70%">
      <stop offset="0%" stop-color="#6d101d" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#6d101d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sipario" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6d101d" stop-opacity="0.45"/>
      <stop offset="12%" stop-color="#6d101d" stop-opacity="0"/>
      <stop offset="88%" stop-color="#6d101d" stop-opacity="0"/>
      <stop offset="100%" stop-color="#6d101d" stop-opacity="0.45"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#fondo)"/>
  <rect width="1200" height="300" fill="url(#alone)"/>
  <rect width="1200" height="300" fill="url(#sipario)"/>

  <!-- filetto superiore e inferiore -->
  <rect x="0" y="0" width="1200" height="2" fill="#d4af37" opacity="0.5"/>
  <rect x="0" y="298" width="1200" height="2" fill="#d4af37" opacity="0.5"/>

  <!-- sigillo circolare -->
  <g transform="translate(600 96)">
    <circle r="42" fill="none" stroke="url(#oro)" stroke-width="1.5" opacity="0.9"/>
    <circle r="34" fill="none" stroke="#d4af37" stroke-width="0.6" opacity="0.45"/>
    <text x="0" y="12" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
          font-size="34" fill="url(#oro)">✦</text>
  </g>

  <text x="600" y="196" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="62"
        letter-spacing="14" fill="url(#oro)">CINEMA AUREO</text>

  <text x="600" y="232" text-anchor="middle"
        font-family="Helvetica, Arial, sans-serif" font-size="14"
        letter-spacing="9" fill="#a89f92">CATALOGO · PROGRAMMAZIONE · RECENSIONI</text>

  <!-- perforazioni da pellicola -->
  <g fill="#d4af37" opacity="0.16">
    <rect x="40" y="262" width="16" height="11" rx="2"/>
    <rect x="70" y="262" width="16" height="11" rx="2"/>
    <rect x="100" y="262" width="16" height="11" rx="2"/>
    <rect x="130" y="262" width="16" height="11" rx="2"/>
    <rect x="1054" y="262" width="16" height="11" rx="2"/>
    <rect x="1084" y="262" width="16" height="11" rx="2"/>
    <rect x="1114" y="262" width="16" height="11" rx="2"/>
    <rect x="1144" y="262" width="16" height="11" rx="2"/>
  </g>
</svg>
